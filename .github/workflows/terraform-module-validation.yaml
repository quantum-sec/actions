name: Terraform Module Validation

# Reusable validation for Terraform module repos: the repo's own pre-commit
# hooks (with terraform/tflint/tfsec tooling provisioned) plus a Checkov scan.
# Consumers call this from pull_request and push events; it uses no secrets,
# so it is safe on fork-triggered runs.

on:
  workflow_call:
    inputs:
      terraform_version_file:
        description: Path to the file pinning the Terraform version.
        required: false
        type: string
        default: .terraform-version
      python_version:
        description: Python version used to run pre-commit.
        required: false
        type: string
        default: '3.12'
      checkov_soft_fail:
        description: Whether Checkov findings are non-blocking.
        required: false
        type: boolean
        default: true

jobs:
  pre-commit:
    name: Pre-Commit Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat "${{ inputs.terraform_version_file }}")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Install tfsec
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/tfsec" \
            https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64
          echo "a32d0799bbefababaa4fcd814da9f4d251cd932789590b99d1d5fcb89ace6f68  $HOME/.local/bin/tfsec" | sha256sum -c -
          chmod +x "$HOME/.local/bin/tfsec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  checkov:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: ${{ inputs.checkov_soft_fail }}
