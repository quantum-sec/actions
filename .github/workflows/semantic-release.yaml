name: Semantic Release

# Reusable semantic-release job. Interface mirrors
# armor/actions/.github/workflows/semantic-release.yaml so that consumers
# converge onto that repo with an org-name swap at migration time
# (same GIT_TOKEN_BASIC secret, same `semver` output).

on:
  workflow_call:
    secrets:
      GIT_TOKEN_BASIC:
        required: true
    inputs:
      node_version:
        description: Node.js version used to run semantic-release.
        required: false
        type: string
        default: 'lts/*'
    outputs:
      semver:
        description: The version released from this commit; empty when no release was created.
        value: ${{ jobs.semantic-release.outputs.semver }}

jobs:
  semantic-release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN_BASIC }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN_BASIC }}
        run: npx semantic-release --dry-run false --ci false

      - name: Extract version
        id: version
        run: |
          SEMVER="$(git tag --points-at HEAD --sort=-v:refname | head -1)"
          if [ -n "$SEMVER" ]; then
            echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
            echo "New release: $SEMVER"
          else
            echo "No new release created."
          fi
